<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenMache — Marché Local Haïti</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --text: #16211c;
      --muted: #5c6b63;
      --primary: #0f766e;
      --primary-dark: #0b5a54;
      --accent: #d97706;
      --border: #e2e6e1;
      --danger: #b91c1c;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: 72px;
    }

    /* Smart auto-hiding top navigation bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      transition: transform 0.25s ease;
    }

    .topbar.hidden {
      transform: translateY(-100%);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    select, input, textarea, button {
      font: inherit;
    }

    select, input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }

    .topbar select, .topbar button {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: auto;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-secondary {
      background: #eef2ef;
      color: var(--text);
    }

    .btn-whatsapp {
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .btn-danger {
      background: #fee2e2;
      color: var(--danger);
      padding: 6px 10px;
      font-size: 0.82rem;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }

    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .toolbar { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #e5e9e6;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .status {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 12px;
      display: none;
    }

    .status.show { display: block; }
    .status.ok { background: #dcfce7; color: #166534; }
    .status.err { background: #fee2e2; color: #991b1b; }

    .auth-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top">OpenMache</a>
      <div class="controls">
        <select id="langSelect" aria-label="Language">
          <option value="fr" selected>FR</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
        </select>
        <select id="currencySelect" aria-label="Currency">
          <option value="HTG" selected>HTG</option>
          <option value="USD">USD</option>
        </select>
        <button class="btn-primary" id="toggleSellBtn" type="button">+ Vendre</button>
        <button class="btn-secondary" id="toggleAuthBtn" type="button">Connexion</button>
      </div>
    </div>
  </header>

  <main class="container" id="top">
    <section class="hero">
      <h1 id="heroTitle">Marché local en Haïti</h1>
      <p id="heroSubtitle">Achetez et vendez près de chez vous en HTG ou USD, avec contact direct sur WhatsApp.</p>
      <div class="auth-bar">
        <span id="authStatusText">Mode visiteur — connectez-vous pour publier une annonce.</span>
        <span class="meta" id="rateNote">1 USD ≈ 131 HTG</span>
      </div>
    </section>

    <div class="status" id="statusBox"></div>

    <!-- Auth Panel -->
    <section class="panel" id="authPanel" style="display: none;">
      <h2 id="authHeading">Connexion / Inscription vendeur</h2>
      <form id="authForm" class="form-grid">
        <div class="field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" required placeholder="vendeur@exemple.com" />
        </div>
        <div class="field">
          <label for="authPassword">Mot de passe</label>
          <input id="authPassword" type="password" required minlength="6" placeholder="••••••••" />
        </div>
        <div class="field" style="display: flex; align-items: flex-end; gap: 8px;">
          <button class="btn-primary" type="submit" id="signInBtn">Se connecter</button>
          <button class="btn-secondary" type="button" id="signUpBtn">Créer un compte</button>
          <button class="btn-danger" type="button" id="signOutBtn" style="display: none;">Déconnexion</button>
        </div>
      </form>
    </section>

    <!-- New Listing Form -->
    <section class="panel" id="sellPanel" style="display: none;">
      <h2 id="sellHeading">Publier un article</h2>
      <form id="listingForm">
        <div class="form-grid">
          <div class="field">
            <label for="titleInput" id="lblTitle">Titre *</label>
            <input id="titleInput" type="text" required placeholder="Ex: Téléphone Samsung A15" />
          </div>
          <div class="field">
            <label for="priceInput" id="lblPrice">Prix *</label>
            <input id="priceInput" type="number" step="any" min="0" required placeholder="15000" />
          </div>
          <div class="field">
            <label for="formCurrencySelect" id="lblCurrency">Devise</label>
            <select id="formCurrencySelect">
              <option value="HTG" selected>HTG</option>
              <option value="USD">USD</option>
            </select>
          </div>
          <div class="field">
            <label for="categoryInput" id="lblCategory">Catégorie</label>
            <input id="categoryInput" type="text" placeholder="Électronique, Maison, Mode..." />
          </div>
          <div class="field">
            <label for="neighborhoodInput" id="lblNeighborhood">Quartier / Ville</label>
            <input id="neighborhoodInput" type="text" placeholder="Pétion-Ville, Delmas, Cap-Haïtien..." />
          </div>
          <div class="field">
            <label for="whatsappInput" id="lblWhatsapp">Numéro WhatsApp</label>
            <input id="whatsappInput" type="text" placeholder="5093XXXXXXX" />
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label for="imageUrlInput" id="lblImage">Lien de l'image (URL)</label>
            <input id="imageUrlInput" type="text" placeholder="https://..." />
          </div>
        </div>
        <div style="margin-top: 14px; display: flex; gap: 10px;">
          <button class="btn-primary" type="submit" id="submitListingBtn">Publier l'annonce</button>
        </div>
      </form>
    </section>

    <!-- Search -->
    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Rechercher un article ou un quartier..." />
      <button class="btn-secondary" id="refreshBtn" type="button">Actualiser</button>
    </div>

    <!-- Listings Grid -->
    <section class="grid" id="listingsGrid"></section>
  </main>

  <script>
    const SUPABASE_URL = "https://feoizjhkqxcbqdjpagua.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cdHHDy1Vz6119RdGMXdh9Q_fimsC_BF";
    const USD_TO_HTG = 131;

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const UI_TEXT = {
      fr: {
        heroTitle: "Marché local en Haïti",
        heroSubtitle: "Achetez et vendez près de chez vous en HTG ou USD, avec contact direct sur WhatsApp.",
        sellBtn: "+ Vendre",
        authBtn: "Connexion",
        searchPlaceholder: "Rechercher un article ou un quartier...",
        whatsapp: "WhatsApp",
        deleteBtn: "Supprimer",
        empty: "Aucune annonce publiée pour le moment.",
        guestMsg: "Mode visiteur — connectez-vous pour publier une annonce.",
        loggedInPrefix: "Connecté en tant que ",
        loginRequired: "Connectez-vous d'abord pour publier une annonce."
      },
      en: {
        heroTitle: "Local Marketplace in Haiti",
        heroSubtitle: "Buy and sell locally in HTG or USD with direct WhatsApp contact.",
        sellBtn: "+ Sell",
        authBtn: "Sign In",
        searchPlaceholder: "Search items or neighborhoods...",
        whatsapp: "WhatsApp",
        deleteBtn: "Delete",
        empty: "No listings available yet.",
        guestMsg: "Guest mode — sign in to post a listing.",
        loggedInPrefix: "Signed in as ",
        loginRequired: "Please sign in first to post a listing."
      },
      es: {
        heroTitle: "Mercado local en Haití",
        heroSubtitle: "Compra y vende cerca de ti en HTG o USD con contacto directo por WhatsApp.",
        sellBtn: "+ Vender",
        authBtn: "Iniciar sesión",
        searchPlaceholder: "Buscar artículos o barrios...",
        whatsapp: "WhatsApp",
        deleteBtn: "Eliminar",
        empty: "No hay publicaciones por el momento.",
        guestMsg: "Modo invitado — inicia sesión para publicar.",
        loggedInPrefix: "Sesión iniciada como ",
        loginRequired: "Inicia sesión primero para publicar un anuncio."
      }
    };

    let currentLang = "fr";
    let currentCurrency = "HTG";
    let currentUser = null;
    let allListings = [];

    const statusBox = document.getElementById("statusBox");
    const listingsGrid = document.getElementById("listingsGrid");
    const authPanel = document.getElementById("authPanel");
    const sellPanel = document.getElementById("sellPanel");
    const langSelect = document.getElementById("langSelect");
    const currencySelect = document.getElementById("currencySelect");
    const searchInput = document.getElementById("searchInput");

    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.className = "status show " + (isError ? "err" : "ok");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatPrice(amount, fromCurrency) {
      const num = Number(amount) || 0;
      let converted = num;
      if (fromCurrency === "HTG" && currentCurrency === "USD") {
        converted = num / USD_TO_HTG;
      } else if (fromCurrency === "USD" && currentCurrency === "HTG") {
        converted = num * USD_TO_HTG;
      }
      if (currentCurrency === "USD") {
        return "$" + converted.toFixed(2) + " USD";
      }
      return Math.round(converted).toLocaleString("fr-HT") + " HTG";
    }

    function applyTranslations() {
      const t = UI_TEXT[currentLang] || UI_TEXT.fr;
      document.documentElement.lang = currentLang;
      document.getElementById("heroTitle").textContent = t.heroTitle;
      document.getElementById("heroSubtitle").textContent = t.heroSubtitle;
      document.getElementById("toggleSellBtn").textContent = t.sellBtn;
      document.getElementById("toggleAuthBtn").textContent = currentUser ? t.authBtn : t.authBtn;
      searchInput.placeholder = t.searchPlaceholder;
      updateAuthUi();
      renderListings();
    }

    function updateAuthUi() {
      const t = UI_TEXT[currentLang] || UI_TEXT.fr;
      const authStatusText = document.getElementById("authStatusText");
      const signOutBtn = document.getElementById("signOutBtn");
      if (currentUser) {
        authStatusText.textContent = t.loggedInPrefix + (currentUser.email || "");
        signOutBtn.style.display = "inline-block";
      } else {
        authStatusText.textContent = t.guestMsg;
        signOutBtn.style.display = "none";
      }
    }

    function getListingTitle(item) {
      if (item.translations && typeof item.translations === "object" && item.translations[currentLang]) {
        return item.translations[currentLang];
      }
      return item.title;
    }

    function renderListings() {
      const t = UI_TEXT[currentLang] || UI_TEXT.fr;
      const q = searchInput.value.trim().toLowerCase();

      const filtered = allListings.filter((item) => {
        const title = getListingTitle(item).toLowerCase();
        const hood = (item.neighborhood || "").toLowerCase();
        const cat = (item.category || "").toLowerCase();
        return !q || title.includes(q) || hood.includes(q) || cat.includes(q);
      });

      if (!filtered.length) {
        listingsGrid.innerHTML = `<p class="meta">${escapeHtml(t.empty)}</p>`;
        return;
      }

      listingsGrid.innerHTML = filtered.map((item) => {
        const cleanPhone = String(item.whatsapp || "").replace(/\D/g, "");
        const waLink = cleanPhone
          ? `<a class="btn-whatsapp" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(cleanPhone)}?text=${encodeURIComponent("Bonjour, je suis intéressé par : " + getListingTitle(item))}">${escapeHtml(t.whatsapp)}</a>`
          : "";

        const canDelete = currentUser && item.user_id === currentUser.id;
        const delBtn = canDelete
          ? `<button class="btn-danger" type="button" onclick="deleteListing('${escapeHtml(item.id)}')">${escapeHtml(t.deleteBtn)}</button>`
          : "";

        const imgHtml = item.image_url
          ? `<img class="card-img" src="${escapeHtml(item.image_url)}" alt="${escapeHtml(getListingTitle(item))}" onerror="this.style.display='none'" />`
          : "";

        return `
          <article class="card">
            ${imgHtml}
            <div class="card-body">
              <div class="price">${escapeHtml(formatPrice(item.price, item.currency || "HTG"))}</div>
              <strong>${escapeHtml(getListingTitle(item))}</strong>
              <div class="meta">${escapeHtml([item.category, item.neighborhood].filter(Boolean).join(" • "))}</div>
              <div class="card-actions">
                ${waLink}
                ${delBtn}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadListings() {
      const { data, error } = await sb
        .from("listings")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        showStatus("Erreur de chargement : " + error.message, true);
        return;
      }
      allListings = data || [];
      renderListings();
    }

    window.deleteListing = async function(id) {
      const { error } = await sb.from("listings").delete().eq("id", id);
      if (error) {
        showStatus("Erreur lors de la suppression : " + error.message, true);
        return;
      }
      showStatus("Annonce supprimée.");
      await loadListings();
    };

    document.getElementById("listingForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = UI_TEXT[currentLang] || UI_TEXT.fr;
      if (!currentUser) {
        showStatus(t.loginRequired, true);
        authPanel.style.display = "block";
        return;
      }

      const title = document.getElementById("titleInput").value.trim();
      const price = Number(document.getElementById("priceInput").value);
      const currency = document.getElementById("formCurrencySelect").value;
      const category = document.getElementById("categoryInput").value.trim() || null;
      const neighborhood = document.getElementById("neighborhoodInput").value.trim() || null;
      const whatsapp = document.getElementById("whatsappInput").value.trim() || null;
      const image_url = document.getElementById("imageUrlInput").value.trim() || null;

      const { error } = await sb.from("listings").insert([{
        user_id: currentUser.id,
        title,
        price,
        currency,
        category,
        neighborhood,
        whatsapp,
        image_url,
        translations: { [currentLang]: title }
      }]);

      if (error) {
        showStatus("Erreur de publication : " + error.message, true);
        return;
      }

      e.target.reset();
      sellPanel.style.display = "none";
      showStatus("Annonce publiée avec succès !");
      await loadListings();
    });

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        showStatus("Connexion impossible : " + error.message, true);
        return;
      }
      authPanel.style.display = "none";
      showStatus("Connecté !");
    });

    document.getElementById("signUpBtn").addEventListener("click", async () => {
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      if (!email || password.length < 6) {
        showStatus("Entrez un email et un mot de passe (6 caractères minimum).", true);
        return;
      }
      const { error } = await sb.auth.signUp({ email, password });
      if (error) {
        showStatus("Inscription impossible : " + error.message, true);
        return;
      }
      showStatus("Compte créé ! Vérifiez votre boîte mail si une confirmation est activée.");
    });

    document.getElementById("signOutBtn").addEventListener("click", async () => {
      await sb.auth.signOut();
      showStatus("Déconnecté.");
    });

    document.getElementById("toggleSellBtn").addEventListener("click", () => {
      const t = UI_TEXT[currentLang] || UI_TEXT.fr;
      if (!currentUser) {
        showStatus(t.loginRequired, true);
        authPanel.style.display = "block";
        return;
      }
      sellPanel.style.display = sellPanel.style.display === "none" ? "block" : "none";
    });

    document.getElementById("toggleAuthBtn").addEventListener("click", () => {
      authPanel.style.display = authPanel.style.display === "none" ? "block" : "none";
    });

    document.getElementById("refreshBtn").addEventListener("click", loadListings);
    searchInput.addEventListener("input", renderListings);

    langSelect.addEventListener("change", (e) => {
      currentLang = e.target.value;
      applyTranslations();
    });

    currencySelect.addEventListener("change", (e) => {
      currentCurrency = e.target.value;
      renderListings();
    });

    // Smart auto-hiding top bar on scroll
    let lastScrollY = window.scrollY;
    const topbar = document.getElementById("topbar");
    window.addEventListener("scroll", () => {
      const nowY = window.scrollY;
      if (nowY > lastScrollY && nowY > 90) {
        topbar.classList.add("hidden");
      } else if (nowY < lastScrollY) {
        topbar.classList.remove("hidden");
      }
      lastScrollY = nowY;
    }, { passive: true });

    sb.auth.onAuthStateChange((_event, session) => {
      currentUser = session?.user || null;
      updateAuthUi();
      renderListings();
    });

    (async function init() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user || null;
      applyTranslations();
      await loadListings();
    })();
  </script>
</body>
</html>
